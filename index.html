<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BestCare Physiotherapy Pvt. Ltd. | Coming Soon</title>
  <meta name="description" content="BestCare Physiotherapy Pvt. Ltd. is currently transforming. Connect with us on WhatsApp in the meanwhile.">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #f3f6ff;
      --card: #ffffff;
      --text: #122034;
      --muted: #5b6b81;
      --accent: #25d366;
      --accent-hover: #1fa855;
      --ring: rgba(37, 211, 102, 0.24);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 15% 20%, #ffffff 0%, var(--bg) 58%);
    }

    .card {
      width: min(560px, 100%);
      padding: 40px 30px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid #dbe4f0;
      text-align: center;
      box-shadow: 0 16px 36px rgba(16, 24, 40, 0.1);
    }

    .logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 15px;
      background: #ffffff;
      padding: 8px;
      box-shadow: 0 0 0 0 var(--ring);
      animation: pulse 2.8s ease-in-out infinite;
    }

    .name {
      margin: 18px 0 10px;
      font-size: clamp(1.45rem, 2.8vw, 1.9rem);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.01em;
    }

    .message {
      margin: 0;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .whatsapp-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .whatsapp-link:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .whatsapp-link img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--ring); }
      50% { box-shadow: 0 0 0 14px rgba(37, 211, 102, 0); }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <img class="logo" src="/logo.png" alt="BestCare Physiotherapy Pvt. Ltd. logo">
    <h1 class="name">BestCare Physiotherapy Pvt. Ltd.</h1>
    <p class="message">We are currently transforming. In the meanwhile, connect with us on WhatsApp.</p>
    <a class="whatsapp-link" href="https://wa.me/918383040436" target="_blank" rel="noopener noreferrer">
      <img src="/whatsapp.png" alt="WhatsApp">
      Chat on WhatsApp
    </a>
  </main>
</body>
</html>
