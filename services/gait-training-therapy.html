<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BestCare Physio | Coming Soon</title>
  <meta name="description" content="BestCare Physio website is coming soon.">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #64748b;
      --ring: rgba(37, 99, 235, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, #ffffff 0%, var(--bg) 55%);
    }

    .card {
      width: min(440px, 100%);
      padding: 36px 28px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid #e2e8f0;
      text-align: center;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      animation: float 5s ease-in-out infinite;
    }

    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 14px;
      background: #ffffff;
      padding: 8px;
      box-shadow: 0 0 0 0 var(--ring);
      animation: pulse 2.6s ease-in-out infinite;
    }

    .name {
      margin: 16px 0 6px;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .soon {
      margin: 0;
      font-size: 0.98rem;
      color: var(--muted);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--ring); }
      50% { box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <img class="logo" src="/logo.png" alt="BestCare Physio logo">
    <h1 class="name">BestCare Physio</h1>
    <p class="soon">Coming Soon</p>
  </main>
</body>
</html>
